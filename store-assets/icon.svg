<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background (Play Store applies its own mask) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)" />

  <!-- Worksheet paper -->
  <rect x="89.6" y="89.6" width="256" height="320" rx="32" fill="white" opacity="0.95" />

  <!-- Folded corner on paper -->
  <path d="M294.4 89.6 L345.6 89.6 L345.6 140.8 Z" fill="#CBD5E1" opacity="0.6" />
  <path d="M294.4 89.6 L345.6 140.8 L294.4 140.8 Z" fill="white" opacity="0.7" />

  <!-- Worksheet lines on paper -->
  <line x1="140.8" y1="192" x2="294.4" y2="192" stroke="#94A3B8" stroke-width="19.2" stroke-linecap="round" />
  <line x1="140.8" y1="243.2" x2="268.8" y2="243.2" stroke="#94A3B8" stroke-width="19.2" stroke-linecap="round" />
  <line x1="140.8" y1="294.4" x2="281.6" y2="294.4" stroke="#94A3B8" stroke-width="19.2" stroke-linecap="round" />
  <line x1="140.8" y1="345.6" x2="243.2" y2="345.6" stroke="#94A3B8" stroke-width="19.2" stroke-linecap="round" />

  <!-- Pencil — tilted 45°, bottom-right, overlapping paper -->
  <g transform="rotate(-45 384 358.4)">
    <!-- Eraser (pink) -->
    <rect x="345.6" y="204.8" width="76.8" height="38.4" rx="12.8" fill="#FB7185" />
    <!-- Metal band -->
    <rect x="345.6" y="243.2" width="76.8" height="19.2" fill="#9CA3AF" />
    <!-- Pencil body (yellow) -->
    <rect x="345.6" y="262.4" width="76.8" height="115.2" fill="#FCD34D" />
    <!-- Wood tip -->
    <path d="M345.6 377.6 L422.4 377.6 L384 435.2 Z" fill="#F5E6C8" />
    <!-- Graphite tip -->
    <path d="M364.8 377.6 L403.2 377.6 L384 416 Z" fill="#374151" />
  </g>
</svg>
